<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="HIIT Workout Timer - Customizable interval timer for high-intensity workouts">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>HIIT Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" role="application" aria-label="HIIT Workout Timer">
    <header>
      <h1>HIIT Timer</h1>
    </header>

    <main>
      <!-- Configuration Section -->
      <section class="config" id="config-section" aria-label="Workout Configuration">
        <div class="config-field">
          <label for="work-duration">Work (seconds)</label>
          <input type="number" id="work-duration" min="1" max="600" value="30" aria-describedby="work-hint">
          <span id="work-hint" class="visually-hidden">Enter work interval duration between 1 and 600 seconds</span>
        </div>
        <div class="config-field">
          <label for="rest-duration">Rest (seconds)</label>
          <input type="number" id="rest-duration" min="1" max="600" value="10" aria-describedby="rest-hint">
          <span id="rest-hint" class="visually-hidden">Enter rest interval duration between 1 and 600 seconds</span>
        </div>
        <div class="config-field">
          <label for="rounds">Rounds</label>
          <input type="number" id="rounds" min="1" max="99" value="8" aria-describedby="rounds-hint">
          <span id="rounds-hint" class="visually-hidden">Enter number of rounds between 1 and 99</span>
        </div>
      </section>

      <!-- Timer Display -->
      <section class="timer-display" id="timer-display" aria-label="Timer Display" aria-live="polite">
        <div class="phase-label" id="phase-label" role="status">READY</div>
        <div class="countdown" id="countdown" aria-label="Time remaining">0:00</div>
        <div class="round-counter" id="round-counter" aria-label="Current round">0 / 8</div>
      </section>

      <!-- Controls -->
      <section class="controls" aria-label="Timer Controls">
        <button id="start-btn" class="btn btn-primary" aria-label="Start workout">Start</button>
        <button id="pause-btn" class="btn btn-secondary" disabled aria-label="Pause workout">Pause</button>
        <button id="reset-btn" class="btn btn-secondary" disabled aria-label="Reset workout">Reset</button>
      </section>
    </main>
  </div>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
