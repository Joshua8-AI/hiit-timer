services:
  hiit-timer:
    build:
      context: .
      pull: true            # always rebuild on the current base image
    ports:
      - "80:8080"
    restart: unless-stopped
    # Static file server: needs no capabilities, no writable root, no privilege gain.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
          pids: 64
        reservations:
          cpus: '0.25'
          memory: 64M
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
