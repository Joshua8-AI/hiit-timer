server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Disabled: the legacy XSS auditor is removed from modern browsers and
    # enabling it can introduce XS-leak side channels in old ones
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Files are unversioned, so require revalidation (cheap 304s via ETag).
    # Without this, CDNs like Cloudflare cache css/js at the edge with
    # default TTLs and serve stale assets after a deploy.
    add_header Cache-Control "no-cache" always;

    # Read-only site: refuse everything except GET/HEAD.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Never serve dotfiles, even if one is copied into the web root by mistake.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
